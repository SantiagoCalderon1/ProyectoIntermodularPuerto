<div id="container-authorization-list"
class="col-8 col-md-12  container-fluid d-flex justify-content-center align-items-center">
    <div class="col-8 col-md-12 ">
        <div class="card text-start shadow-lg">
            <div class="card-header title text-center">
                <h2 class="fs-4">Listado de facturas</h2>
            </div>
            <div class="card-body">
                <!-- Botones Responsivos -->
                <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
                    <button class="btn btn-primary" (click)="descargarPDF()">
                        <i class="fa-solid fa-print"></i> Imprimir Tabla
                    </button>
                    <button *ngIf="rol==3 || rol==4" class="btn btn-success" [routerLink]="['/facturas', 0, 0]">
                        <i class="fa-solid fa-square-plus"></i> Nueva Factura
                    </button>
                </div>

                <!-- Mensaje si no hay datos -->
                <div *ngIf="facturas" class="w-100">
                    <h5 *ngIf="facturas.length === 0" class="text-center text-muted mt-3">
                        No hay datos para mostrar.
                    </h5>

                    <!-- Tabla Responsiva -->
                    <div *ngIf="facturas.length > 0" id="container-table" class="table-responsive">
                        <table id="tableFacturas" class="table text-center table-striped table-hover table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>Número Factura</th>
                                    <th>Cliente</th>
                                    <th>Dias</th>
                                    <th>Fecha expedicion</th>
                                    <th>Fecha vencimiento</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                    <!-- <th *ngIf="rol==3 || rol==4">Acciones</th> -->
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of facturas">
                                    <td>{{ item.num_factura }}</td>
                                    <td>{{ item.nif_cliente }}</td>
                                    <td>{{ item.dias }}</td>
                                    <td>{{ item.fecha_expedicion }}</td>
                                    <td>{{ item.fecha_vencimiento }}</td>
                                    <td>{{ item.total }}</td>
                                    <td *ngIf="item.cobrada == '1'">Cobrada</td>
                                    <td *ngIf="item.cobrada != '1'">No cobrada</td>
                                    <td *ngIf="rol==3 || rol==4">
                                        <button class="btn btn-sm btn-warning ms-1" data-bs-toggle="tooltip"
                                            title="Modificar factura {{ item.num_factura }}"
                                            [routerLink]="['/facturas', 1, item.num_factura]">
                                            <i class="fa-regular fa-pen-to-square"></i>
                                        </button>

                                        <button class="btn btn-sm btn-info ms-1" data-bs-toggle="tooltip"
                                            title="Imprimir factura {{ item.num_factura }}"
                                            (click)="imprimirFactura(item)">
                                            <i class="fa-solid fa-print"></i>
                                        </button>
                                    </td>

                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
