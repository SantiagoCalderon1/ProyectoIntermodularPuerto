<div id="container-create-invoice" class="d-flex justify-content-center align-items-center">
    <div class="col-10 col-md-11 col-lg-12">
        <div class="card text-start shadow-lg">
            <div class="card-header title text-center">
                <h2 class="fs-4">{{ titulo }}</h2>
            </div>
            <div class="card-body">
                <form #facturaForm="ngForm" (ngSubmit)="guardarFactura()" (ngModelChange)="cambiado()">

                    <div class="row mb-3">
                        <div class="mb-3 col-md-6">
                            <label for="num_factura" class="form-label">Número de Factura:</label>
                            <input type="text" class="form-control" [(ngModel)]="facturaAct.num_factura"
                                name="num_factura" id="num_factura" required>
                        </div>

                        <div class="mb-3 col-md-6">
                            <label for="cliente" class="form-label">Cliente:</label>
                            <ng-select name="cliente" [items]="clientes" bindLabel="nombreCompleto"
                                [(ngModel)]="cliente" class="form-select" (change)="actualizaClienteActual()">
                            </ng-select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="mb-3 col-md-6">
                            <label for="fecha_expedicion" class="form-label">Fecha de Expedición:</label>
                            <input type="text" class="form-control" [(ngModel)]="facturaAct.fecha_expedicion"
                                name="fecha_expedicion" id="fecha_expedicion" placeholder="yyyy/mm/dd" required>
                        </div>


                        <div class="mb-3 col-md-6">
                            <label for="fecha_vencimiento" class="form-label">Fecha de Vencimiento:</label>
                            <input type="text" class="form-control" [(ngModel)]="facturaAct.fecha_vencimiento"
                                name="fecha_vencimiento" id="fecha_vencimiento" placeholder="yyyy/mm/dd" required>
                        </div>
                    </div>

                    <div class="row mb-3">

                        <div class="mb-3 col-md-6">
                            <label for="cliente" class="form-label">Reserva:</label>
                            <ng-select name="reserva" [items]="reservas" bindLabel="id_reserva" bindValue="id_reserva"
                                [(ngModel)]="facturaAct.id_reserva" class="form-select"
                                (change)="actualizaReservaActual()">
                            </ng-select>
                        </div>

                        <div class="mb-3 col-md-6">
                            <label for="dias" class="form-label">Días:</label>
                            <input type="number" class="form-control" [(ngModel)]="facturaAct.dias" name="dias"
                                id="dias" (change)="actualizaBase()" required min="1">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="mb-3 col-md-4">
                            <label for="precio_unitario" class="form-label">Precio Unitario:</label>
                            <input type="number" step="0.01" class="form-control"
                                [(ngModel)]="facturaAct.precio_unitario" (change)="actualizaBase()"
                                name="precio_unitario" id="precio_unitario" required min="1">
                        </div>

                        <div class="mb-3 col-md-4">
                            <label for="base_imponible" class="form-label">Base Imponible:</label>
                            <input type="number" step="0.01" class="form-control"
                                [(ngModel)]="facturaAct.base_imponible" (change)="actualizaTotal()"
                                name="base_imponible" id="base_imponible" disabled>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="mb-3 col-md-6">
                            <label for="tipo_iva" class="form-label">Tipo IVA (%):</label>
                            <input type="number" step="0.01" class="form-control" [(ngModel)]="facturaAct.tipo_iva"
                                (change)="actualizaTotal()" name="tipo_iva" id="tipo_iva" required min="1">
                        </div>

                        <div class="mb-3 col-md-6">
                            <label for="tipo_irpf" class="form-label">Tipo IRPF (%):</label>
                            <input type="number" step="0.01" class="form-control" [(ngModel)]="facturaAct.tipo_irpf"
                                (change)="actualizaTotal()" name="tipo_irpf" id="tipo_irpf" required min="1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="total" class="form-label">Total:</label>
                        <input type="number" step="0.01" class="form-control" [(ngModel)]="facturaAct.total"
                            name="total" id="total" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado:</label>
                        <select class="form-control" [(ngModel)]="facturaAct.cobrada" name="estado" id="estado"
                            required>
                            <option [value]='1'>Cobrada</option>
                            <option [value]='0'>No Cobrada</option>
                        </select>
                    </div>

                    <div class="my-3 text-center">
                        <div name="cancelar" class="btn btn-secondary btn-lg me-3">
                            <a [routerLink]="['/listaFacturas']">Cancelar</a>
                        </div>
                        <input type="submit" class="btn btn-dark btn-lg" [value]="txtBtn">
                    </div>

                </form>

                <!-- Mensajes de estado -->
                <p *ngIf="formularioCambiado" class="text-warning text-center mt-3">Tienes cambios sin guardar</p>
            </div>
        </div>
    </div>
</div>
